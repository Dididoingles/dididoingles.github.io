<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<title>Página não encontrada · Di Carvalho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #09090b;
    --text: #ffffff;
    --muted: #a1a1aa;
    --red: #c20000;
    --red-dark: #800000;
    --line: rgba(255,255,255,0.1);
  }

  *{ box-sizing: border-box; margin: 0; padding: 0; }

  html, body{
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
    letter-spacing: -0.60px;
    overflow: hidden;
  }

  body::before{
    content:"";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 10% 20%, rgba(194,0,0,0.10), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(194,0,0,0.05), transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .stage{
    position: relative;
    z-index: 1;
    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px clamp(24px, 6vw, 80px);
    gap: 60px;
  }

  /* ============ COLUNA 1: FOTO/DISCO ============ */
  .photo-col {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .disc-container {
    position: relative;
    width: clamp(280px, 32vw, 420px);
    aspect-ratio: 1;
    border-radius: 50%;
    display: grid;
    place-items: center;
    box-shadow: 0 0 60px rgba(194,0,0,0.15);
  }

  /* 1. O DISCO ESCURO GIRANDO (Atrás de tudo) */
  .vinyl-base {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: repeating-radial-gradient(
      circle at center,
      #121214 0%,
      #121214 2%,
      #18181b 3%,
      #18181b 4%,
      #121214 5%
    );
    border: 2px solid #0a0a0c;
    box-shadow: inset 0 0 20px rgba(0,0,0,1);
    animation: spin 20s linear infinite; 
    z-index: 1;
  }

  /* 2. O FURO DO DISCO GIRANDO (Atrás da foto) */
  .vinyl-hole {
    position: absolute;
    width: 20%;
    height: 20%;
    background: var(--bg);
    border-radius: 50%;
    z-index: 2;
    box-shadow: inset 0 0 15px rgba(0,0,0,1);
    animation: spin 20s linear infinite; 
  }

  .vinyl-hole::after {
    content: "";
    position: absolute;
    inset: 40%;
    background: var(--red);
    border-radius: 50%;
  }

  /* 3. SUA FOTO (Z-INDEX 10, PARADA, COBRINDO TUDO) */
  .profile-disc {
    position: relative;
    z-index: 10; 
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    /* Borda escura original da foto */
    border: 4px solid #18181b; 
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  .profile-disc.loaded {
    opacity: 1;
  }

  /* 4. O CONTORNO QUE VOCÊ GOSTOU (Z-INDEX 20, GIRANDO POR FORA) */
  .loading-ring {
    position: absolute;
    inset: -10px; /* Fica para fora da foto */
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: var(--red);
    border-bottom-color: var(--red-dark);
    animation: spin 40s linear infinite; /* Giro lento */
    z-index: 20; 
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* ============ COLUNA 2: CONTEÚDO ============ */
  .content-col {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
  }

  .error-tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 12px;
  }

  .error-title {
    font-size: clamp(40px, 6vw, 72px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -2px;
    margin-bottom: 16px;
  }

  .error-title span {
    color: var(--red);
  }

  .intro-text {
    font-size: clamp(14px, 1.5vw, 16px);
    color: var(--muted);
    line-height: 1.6;
    max-width: 48ch;
    margin-bottom: 32px;
  }

  .intro-text strong {
    color: var(--text);
    font-weight: 600;
  }

  /* ============ BOTÕES / LINKS ============ */
  .links-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 400px;
  }

  .link-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: #18181b;
    border: 1px solid var(--line);
    border-radius: 12px;
    text-decoration: none;
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    transition: all 0.3s ease;
    cursor: pointer;
  }

  .link-btn:hover {
    background: #27272a;
    border-color: var(--red);
    transform: translateX(6px);
  }

  .link-btn.primary {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
  }

  .link-btn.primary:hover {
    background: var(--red-dark);
    border-color: var(--red-dark);
    box-shadow: 0 10px 30px rgba(194,0,0,0.3);
  }

  .link-content {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .link-btn svg {
    width: 18px;
    height: 18px;
    transition: transform 0.3s ease;
  }
  
  .link-btn:hover svg.arrow {
    transform: translateX(4px);
  }

  /* ============ RESPONSIVO ============ */
  @media (max-width: 860px){
    html, body{
      height: auto;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .stage{
      grid-template-columns: 1fr;
      height: auto;
      min-height: 100vh;
      padding: 48px 24px;
      gap: 40px;
    }
    .photo-col {
      order: -1;
    }
    .disc-container {
      width: clamp(220px, 60vw, 300px);
    }
    .content-col {
      align-items: center;
      text-align: center;
    }
    .links-grid {
      align-items: center;
    }
    .link-btn {
      width: 100%;
    }
  }
</style>
</head>
<body>

<main class="stage">

  <div class="photo-col">
    <div class="disc-container">
      
      <!-- Disco escuro girando atrás -->
      <div class="vinyl-base"></div>
      <!-- Furo girando atrás -->
      <div class="vinyl-hole"></div>
      
      <!-- A foto por cima de TUDO -->
      <img src="profile.png" alt="Foto de perfil de Di Carvalho" class="profile-disc" id="profileImg">
      
      <!-- O contorno original que você gostou, agora girando por fora -->
      <div class="loading-ring"></div>
      
    </div>
  </div>

  <div class="content-col">
    
    <div class="error-tag">Di Carvalho - Professora de Inglês</div>
    
    <h1 class="error-title">Ops, <span>404</span></h1>
    
    <p class="intro-text">
      🕯️ <strong>Não encontramos a página que você procura.</strong><br><br> 🎓 Mas já que estamos aqui conheça meu trabalho. 🎓<br><br>
    </p>

    <div class="links-grid">
      <a href="https://dididoingles.github.io/saibamais/" class="link-btn primary" target="_blank" rel="noopener noreferrer">
        <div class="link-content">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          Site Oficial
        </div>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
        </svg>
      </a>

      <a href="https://wa.me/5516993272278" class="link-btn" target="_blank" rel="noopener noreferrer">
        <div class="link-content">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
          Fale comigo (WhatsApp)
        </div>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
        </svg>
      </a>

      <a href="https://www.instagram.com/dicarvalho.prof/" class="link-btn" target="_blank" rel="noopener noreferrer">
        <div class="link-content">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
          </svg>
          Instagram (@dicarvalho.prof)
        </div>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
        </svg>
      </a>
    </div>

  </div>

</main>

<script>
  const img = document.getElementById('profileImg');
  
  if (img.complete) {
    setTimeout(() => img.classList.add('loaded'), 1000);
  } else {
    img.addEventListener('load', () => {
      setTimeout(() => img.classList.add('loaded'), 1000);
    });
  }
</script>
</body>
</html>
